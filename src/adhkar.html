<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أذكار وأدعية — نور</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../design sys/style.css">
</head>
<body>

    <div class="container">
        <header>
            <a href="index.html" class="back-link">→</a>
            <h1>أذكار وأدعية</h1>
        </header>

        <div class="filters" id="filters"></div>

        <div id="dhikr-container">
            <div class="loading">
                <div class="spinner"></div>
                <div>جارٍ التحميل...</div>
            </div>
        </div>
    </div>

    <script>
        const DATA_URL = 'https://raw.githubusercontent.com/Gameman2012/athkar/main/data/adhkar.json';
        const CACHE_KEY = 'adhkar_cache';
        const CACHE_TTL = 24 * 60 * 60 * 1000;

        let allAdhkar = [];
        let activeTag = 'الكل';

        function getCached() {
            try {
                const c = JSON.parse(localStorage.getItem(CACHE_KEY));
                if (c && Date.now() - c.ts < CACHE_TTL) return c.data;
            } catch {}
            return null;
        }

        function setCache(data) {
            try { localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), data })); } catch {}
        }

        async function loadAdhkar() {
            const cached = getCached();
            if (cached) {
                allAdhkar = cached.adhkar;
                renderFilters(cached.tags);
                renderAdhkar(allAdhkar);
                return;
            }
            try {
                const res = await fetch(DATA_URL);
                const data = await res.json();
                setCache(data);
                allAdhkar = data.adhkar;
                renderFilters(data.tags);
                renderAdhkar(allAdhkar);
            } catch (err) {
                document.getElementById('dhikr-container').innerHTML =
                    '<div class="empty-state">حدث خطأ أثناء تحميل البيانات</div>';
            }
        }

        function renderFilters(tags) {
            const container = document.getElementById('filters');
            const allBtn = document.createElement('button');
            allBtn.className = 'filter-btn active';
            allBtn.textContent = 'الكل';
            allBtn.onclick = () => filterByTag('الكل');
            container.appendChild(allBtn);

            tags.forEach(tag => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.textContent = tag;
                btn.onclick = () => filterByTag(tag);
                container.appendChild(btn);
            });
        }

        function filterByTag(tag) {
            activeTag = tag;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent === tag);
            });

            if (tag === 'الكل') {
                renderAdhkar(allAdhkar);
            } else {
                const filtered = allAdhkar.filter(d => d.tags.includes(tag));
                renderAdhkar(filtered);
            }
        }

        function renderAdhkar(adhkar) {
            const container = document.getElementById('dhikr-container');

            if (adhkar.length === 0) {
                container.innerHTML = '<div class="empty-state">لا أذكار في هذا التصنيف</div>';
                return;
            }

            container.innerHTML = '<div class="dhikr-list">' + adhkar.map(d => `
                <div class="dhikr-card">
                    <div class="dhikr-text">${d.text}</div>
                    <div class="dhikr-meta">
                        <span class="dhikr-count">التكرار: ${d.count}</span>
                        <span class="dhikr-source">${d.source}</span>
                        <div class="dhikr-tags">
                            ${d.tags.map(t => `<span class="dhikr-tag">${t}</span>`).join('')}
                        </div>
                    </div>
                    ${d.footer ? `<div class="dhikr-footer">${d.footer}</div>` : ''}
                </div>
            `).join('') + '</div>';
        }

        loadAdhkar();
    </script>

</body>
</html>
