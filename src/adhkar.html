<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أذكار وأدعية — نور</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0e1a;
            --bg-card: #111827;
            --bg-card-hover: #1a2332;
            --gold: #d4a843;
            --gold-light: #f0d48a;
            --gold-dim: #8a6d2b;
            --text-primary: #e8e0d0;
            --text-secondary: #9a917e;
            --border: #1e293b;
            --green: #2d6a4f;
            --green-light: #40916c;
        }

        body {
            font-family: 'Noto Naskh Arabic', serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 20% 0%, rgba(212, 168, 67, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 100%, rgba(45, 106, 79, 0.06) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 24px;
            position: relative;
            z-index: 1;
        }

        /* Header */
        header {
            padding: 48px 0 32px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-link {
            color: var(--gold-dim);
            text-decoration: none;
            font-size: 1.5rem;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: var(--gold);
        }

        header h1 {
            font-family: 'Amiri', serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--gold);
        }

        /* Filters */
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }

        .filter-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 8px 20px;
            border-radius: 24px;
            cursor: pointer;
            font-family: 'Noto Naskh Arabic', serif;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .filter-btn:hover {
            border-color: var(--gold-dim);
            color: var(--text-primary);
        }

        .filter-btn.active {
            background: rgba(212, 168, 67, 0.12);
            border-color: var(--gold-dim);
            color: var(--gold);
        }

        /* Adhkar list */
        .dhikr-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 80px;
        }

        .dhikr-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px 28px 20px;
            transition: all 0.3s;
        }

        .dhikr-card:hover {
            border-color: var(--gold-dim);
        }

        .dhikr-text {
            font-family: 'Amiri', serif;
            font-size: 1.3rem;
            line-height: 2.2;
            color: var(--text-primary);
            margin-bottom: 16px;
        }

        .dhikr-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .dhikr-count {
            background: rgba(212, 168, 67, 0.1);
            border: 1px solid rgba(212, 168, 67, 0.2);
            color: var(--gold);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .dhikr-source {
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        .dhikr-tags {
            display: flex;
            gap: 6px;
            margin-right: auto;
        }

        .dhikr-tag {
            background: rgba(45, 106, 79, 0.15);
            border: 1px solid rgba(45, 106, 79, 0.2);
            color: var(--green-light);
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
        }

        .dhikr-footer {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 0.85rem;
            line-height: 1.8;
        }

        .dhikr-footer::before {
            content: '📌 ';
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 64px 0;
            color: var(--text-secondary);
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 64px 0;
            color: var(--gold-dim);
            font-size: 1.1rem;
        }

        .spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--gold-dim);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 640px) {
            header h1 {
                font-size: 1.5rem;
            }

            .dhikr-card {
                padding: 20px;
            }

            .dhikr-text {
                font-size: 1.15rem;
            }

            .filters {
                gap: 8px;
            }

            .filter-btn {
                padding: 6px 14px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <a href="index.html" class="back-link">→</a>
            <h1>أذكار وأدعية</h1>
        </header>

        <div class="filters" id="filters"></div>

        <div id="dhikr-container">
            <div class="loading">
                <div class="spinner"></div>
                <div>جارٍ التحميل...</div>
            </div>
        </div>
    </div>

    <script>
        const DATA_URL = '../data/adhkar.json';

        let allAdhkar = [];
        let activeTag = 'الكل';

        async function loadAdhkar() {
            try {
                const res = await fetch(DATA_URL);
                const data = await res.json();
                allAdhkar = data.adhkar;
                renderFilters(data.tags);
                renderAdhkar(allAdhkar);
            } catch (err) {
                document.getElementById('dhikr-container').innerHTML =
                    '<div class="empty-state">حدث خطأ أثناء تحميل البيانات</div>';
            }
        }

        function renderFilters(tags) {
            const container = document.getElementById('filters');
            const allBtn = document.createElement('button');
            allBtn.className = 'filter-btn active';
            allBtn.textContent = 'الكل';
            allBtn.onclick = () => filterByTag('الكل');
            container.appendChild(allBtn);

            tags.forEach(tag => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.textContent = tag;
                btn.onclick = () => filterByTag(tag);
                container.appendChild(btn);
            });
        }

        function filterByTag(tag) {
            activeTag = tag;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent === tag);
            });

            if (tag === 'الكل') {
                renderAdhkar(allAdhkar);
            } else {
                const filtered = allAdhkar.filter(d => d.tags.includes(tag));
                renderAdhkar(filtered);
            }
        }

        function renderAdhkar(adhkar) {
            const container = document.getElementById('dhikr-container');

            if (adhkar.length === 0) {
                container.innerHTML = '<div class="empty-state">لا أذكار في هذا التصنيف</div>';
                return;
            }

            container.innerHTML = '<div class="dhikr-list">' + adhkar.map(d => `
                <div class="dhikr-card">
                    <div class="dhikr-text">${d.text}</div>
                    <div class="dhikr-meta">
                        <span class="dhikr-count">التكرار: ${d.count}</span>
                        <span class="dhikr-source">${d.source}</span>
                        <div class="dhikr-tags">
                            ${d.tags.map(t => `<span class="dhikr-tag">${t}</span>`).join('')}
                        </div>
                    </div>
                    ${d.footer ? `<div class="dhikr-footer">${d.footer}</div>` : ''}
                </div>
            `).join('') + '</div>';
        }

        loadAdhkar();
    </script>

</body>
</html>
