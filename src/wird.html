<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الورد القرآني اليومي — نور</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../design sys/style.css">
</head>
<body>

    <a href="index.html" class="back-link">→</a>
    <div class="day-info" id="dayInfo"></div>

    <div class="quran-card" id="quran-card">
        <div class="spinner" id="loading-spinner"></div>
        <img src="" alt="صفحة المصحف الشريف" id="quran-img">
    </div>

    <div class="completion-container" id="completion-card">
        <div class="icon">✨</div>
        <h2>تم ختم المصحف بحمد الله</h2>
        <p>مبارك عليك إتمام وردك القرآني اليومي كاملاً.</p>
    </div>

    <script>
        const START_DATE = new Date(2026, 5, 21);
        const MUSHAF_API = 'https://quran.islam-db.com/public/data/pages/quranpages_1024/images/page';

        function initDailyPlan() {
            const today = new Date();
            const date1 = new Date(START_DATE.getFullYear(), START_DATE.getMonth(), START_DATE.getDate());
            const date2 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
            const diffTime = date2 - date1;

            let daysElapsed = Math.round(diffTime / (1000 * 60 * 60 * 24));
            if (daysElapsed < 0) daysElapsed = 0;

            const currentPage = daysElapsed + 1;

            if (currentPage > 604) {
                document.getElementById('quran-card').style.display = 'none';
                document.getElementById('completion-card').style.display = 'flex';
                return;
            }

            document.getElementById('dayInfo').textContent = `اليوم ${daysElapsed + 1} من 604`;
            renderPage(currentPage);
        }

        function renderPage(pageNumber) {
            const img = document.getElementById('quran-img');
            const spinner = document.getElementById('loading-spinner');
            const padded = String(pageNumber).padStart(3, '0');

            img.onload = () => {
                spinner.style.display = 'none';
                img.style.opacity = '1';
            };

            img.onerror = () => {
                spinner.style.display = 'none';
                console.error('فشل تحميل صورة الصفحة القرآنية.');
            };

            img.src = `${MUSHAF_API}${padded}.png?t=${Date.now()}`;
        }

        window.onload = initDailyPlan;
    </script>

</body>
</html>
