<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الورد القرآني اليومي — نور</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e1a;
            --bg-card: #111827;
            --gold: #d4a843;
            --gold-light: #f0d48a;
            --gold-dim: #8a6d2b;
            --text-primary: #e8e0d0;
            --text-secondary: #9a917e;
            --border: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Noto Naskh Arabic', serif;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 20% 0%, rgba(212, 168, 67, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 100%, rgba(45, 106, 79, 0.06) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .back-link {
            position: fixed;
            top: 24px;
            right: 24px;
            color: var(--gold-dim);
            text-decoration: none;
            font-size: 1.5rem;
            transition: color 0.3s;
            z-index: 10;
        }

        .back-link:hover {
            color: var(--gold);
        }

        .day-info {
            position: fixed;
            top: 24px;
            left: 24px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            z-index: 10;
        }

        .quran-card {
            display: flex;
            justify-content: center;
            align-items: center;
            max-height: 96vh;
            max-width: 96vw;
            border-radius: 12px;
            background-color: #fff;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            overflow: hidden;
            position: relative;
            z-index: 1;
        }

        .quran-card img {
            display: block;
            max-height: 96vh;
            max-width: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            transition: opacity 0.3s ease;
            opacity: 0;
        }

        .spinner {
            position: absolute;
            width: 50px;
            height: 50px;
            border: 4px solid rgba(212, 168, 67, 0.1);
            border-top-color: var(--gold-dim);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            z-index: 5;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .completion-container {
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 40px;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            max-width: 450px;
            margin: 20px;
            z-index: 1;
            animation: fadeIn 0.8s ease forwards;
        }

        .completion-container .icon {
            font-size: 3rem;
            color: var(--gold);
            margin-bottom: 20px;
        }

        .completion-container h2 {
            font-family: 'Amiri', serif;
            color: var(--gold);
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .completion-container p {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.6;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">→</a>
    <div class="day-info" id="dayInfo"></div>

    <div class="quran-card" id="quran-card">
        <div class="spinner" id="loading-spinner"></div>
        <img src="" alt="صفحة المصحف الشريف" id="quran-img">
    </div>

    <div class="completion-container" id="completion-card">
        <div class="icon">✨</div>
        <h2>تم ختم المصحف بحمد الله</h2>
        <p>مبارك عليك إتمام وردك القرآني اليومي كاملاً.</p>
    </div>

    <script>
        const START_DATE = new Date(2026, 5, 21);
        const MUSHAF_API = 'https://quran.islam-db.com/public/data/pages/quranpages_1024/images/page';

        function initDailyPlan() {
            const today = new Date();
            const date1 = new Date(START_DATE.getFullYear(), START_DATE.getMonth(), START_DATE.getDate());
            const date2 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
            const diffTime = date2 - date1;

            let daysElapsed = Math.round(diffTime / (1000 * 60 * 60 * 24));
            if (daysElapsed < 0) daysElapsed = 0;

            const currentPage = daysElapsed + 1;

            if (currentPage > 604) {
                document.getElementById('quran-card').style.display = 'none';
                document.getElementById('completion-card').style.display = 'flex';
                return;
            }

            document.getElementById('dayInfo').textContent = `اليوم ${daysElapsed + 1} من 604`;
            renderPage(currentPage);
        }

        function renderPage(pageNumber) {
            const img = document.getElementById('quran-img');
            const spinner = document.getElementById('loading-spinner');
            const padded = String(pageNumber).padStart(3, '0');

            img.onload = () => {
                spinner.style.display = 'none';
                img.style.opacity = '1';
            };

            img.onerror = () => {
                spinner.style.display = 'none';
                console.error('فشل تحميل صورة الصفحة القرآنية.');
            };

            img.src = `${MUSHAF_API}${padded}.png?t=${Date.now()}`;
        }

        window.onload = initDailyPlan;
    </script>

</body>
</html>
