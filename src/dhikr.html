<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ذكر مباشر — نور</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0e1a;
            --bg-card: #111827;
            --bg-card-hover: #1a2332;
            --gold: #d4a843;
            --gold-light: #f0d48a;
            --gold-dim: #8a6d2b;
            --text-primary: #e8e0d0;
            --text-secondary: #9a917e;
            --border: #1e293b;
            --green: #2d6a4f;
            --green-light: #40916c;
        }

        body {
            font-family: 'Noto Naskh Arabic', serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 20% 0%, rgba(212, 168, 67, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 100%, rgba(45, 106, 79, 0.06) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 24px;
            position: relative;
            z-index: 1;
        }

        /* Header */
        header {
            padding: 48px 0 32px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-link {
            color: var(--gold-dim);
            text-decoration: none;
            font-size: 1.5rem;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: var(--gold);
        }

        header h1 {
            font-family: 'Amiri', serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--gold);
        }

        /* Period label */
        .period-label {
            font-family: 'Amiri', serif;
            font-size: 1.3rem;
            color: var(--gold);
            text-align: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        /* Adhkar list */
        .dhikr-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 80px;
        }

        .dhikr-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px 28px 20px;
            transition: all 0.3s;
        }

        .dhikr-card:hover {
            border-color: var(--gold-dim);
        }

        .dhikr-text {
            font-family: 'Amiri', serif;
            font-size: 1.3rem;
            line-height: 2.2;
            color: var(--text-primary);
            margin-bottom: 16px;
        }

        .dhikr-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .dhikr-count {
            background: rgba(212, 168, 67, 0.1);
            border: 1px solid rgba(212, 168, 67, 0.2);
            color: var(--gold);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .dhikr-source {
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        .dhikr-footer {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 0.85rem;
            line-height: 1.8;
        }

        .dhikr-footer::before {
            content: '📌 ';
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 64px 0;
            color: var(--text-secondary);
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 64px 0;
            color: var(--gold-dim);
            font-size: 1.1rem;
        }

        .spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--gold-dim);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 640px) {
            header h1 {
                font-size: 1.5rem;
            }

            .dhikr-card {
                padding: 20px;
            }

            .dhikr-text {
                font-size: 1.15rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <a href="index.html" class="back-link">→</a>
            <h1>ذكر مباشر</h1>
        </header>

<div id="dhikr-container">
            <div class="loading">
                <div class="spinner"></div>
                <div>جارٍ التحميل...</div>
            </div>
        </div>
    </div>

    <script>
        const DATA_URL = 'https://raw.githubusercontent.com/Gameman2012/athkar/main/data/adhkar.json';
        const PRAYER_API = 'https://api.aladhan.com/v1/timingsByIp';

        let allAdhkar = [];

        function timeToMin(t) {
            const [h, m] = t.split(':').map(Number);
            return h * 60 + m;
        }

        function isWithin(minutes, now, after) {
            return now >= minutes && now <= minutes + 30;
        }

        async function getTag() {
            try {
                const res = await fetch(PRAYER_API);
                const data = await res.json();
                const t = data.data.timings;
                const now = new Date();
                const mins = now.getHours() * 60 + now.getMinutes();

                const prayers = ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
                for (const p of prayers) {
                    if (isWithin(timeToMin(t[p]), mins)) return 'صلاة';
                }

                const fajr = timeToMin(t.Fajr);
                const dhuhr = timeToMin(t.Dhuhr);
                const isha = timeToMin(t.Isha);

                if (fajr < dhuhr) {
                    if (mins >= fajr && mins < dhuhr) return 'صباح';
                } else {
                    if (mins >= fajr || mins < dhuhr) return 'صباح';
                }

                if (isha > fajr) {
                    if (mins >= isha || mins < fajr) return 'مساء';
                } else {
                    if (mins >= isha && mins < fajr) return 'مساء';
                }

                return 'عادات';
            } catch {
                const h = new Date().getHours();
                if (h >= 5 && h < 12) return 'صباح';
                if (h >= 18 || h < 5) return 'مساء';
                return 'عادات';
            }
        }

        async function loadAdhkar() {
            try {
                const [adhkarRes, tag] = await Promise.all([
                    fetch(DATA_URL),
                    getTag()
                ]);
                const data = await adhkarRes.json();
                allAdhkar = data.adhkar;
                const filtered = allAdhkar.filter(d => d.tags.includes(tag));
                renderAdhkar(filtered, tag);
            } catch (err) {
                document.getElementById('dhikr-container').innerHTML =
                    '<div class="empty-state">حدث خطأ أثناء تحميل البيانات</div>';
            }
        }

        function renderAdhkar(adhkar, tag) {
            const container = document.getElementById('dhikr-container');
            const tagLabel = { 'صلاة': 'وقت الصلاة', 'صباح': 'أذكار الصباح', 'مساء': 'أذكار المساء', 'عادات': 'أذكار عامة' };
            const header = tagLabel[tag] || tag;

            if (adhkar.length === 0) {
                container.innerHTML = '<div class="empty-state">لا أذكار في هذا التصنيف</div>';
                return;
            }

            container.innerHTML = `<div class="period-label">${header}</div><div class="dhikr-list">` + adhkar.map(d => `
                <div class="dhikr-card">
                    <div class="dhikr-text">${d.text}</div>
                    <div class="dhikr-meta">
                        <span class="dhikr-count">التكرار: ${d.count}</span>
                        <span class="dhikr-source">${d.source}</span>
                    </div>
                    ${d.footer ? `<div class="dhikr-footer">${d.footer}</div>` : ''}
                </div>
            `).join('') + '</div>';
        }

        loadAdhkar();
    </script>

</body>
</html>
