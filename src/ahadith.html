<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أحاديث نبوية — نور</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0e1a;
            --bg-card: #111827;
            --bg-card-hover: #1a2332;
            --gold: #d4a843;
            --gold-light: #f0d48a;
            --gold-dim: #8a6d2b;
            --text-primary: #e8e0d0;
            --text-secondary: #9a917e;
            --border: #1e293b;
            --green: #2d6a4f;
            --green-light: #40916c;
        }

        body {
            font-family: 'Noto Naskh Arabic', serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 20% 0%, rgba(212, 168, 67, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 100%, rgba(45, 106, 79, 0.06) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 24px;
            position: relative;
            z-index: 1;
        }

        header {
            padding: 48px 0 32px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-link {
            color: var(--gold-dim);
            text-decoration: none;
            font-size: 1.5rem;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: var(--gold);
        }

        header h1 {
            font-family: 'Amiri', serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--gold);
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }

        .filter-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 8px 20px;
            border-radius: 24px;
            cursor: pointer;
            font-family: 'Noto Naskh Arabic', serif;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .filter-btn:hover {
            border-color: var(--gold-dim);
            color: var(--text-primary);
        }

        .filter-btn.active {
            background: rgba(212, 168, 67, 0.12);
            border-color: var(--gold-dim);
            color: var(--gold);
        }

        .hadith-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 80px;
        }

        .hadith-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px 28px 20px;
            transition: all 0.3s;
        }

        .hadith-card:hover {
            border-color: var(--gold-dim);
        }

        .hadith-text {
            font-family: 'Amiri', serif;
            font-size: 1.3rem;
            line-height: 2.2;
            color: var(--text-primary);
            margin-bottom: 16px;
        }

        .hadith-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .hadith-source {
            color: var(--gold);
            font-size: 0.85rem;
            font-weight: 600;
        }

        .hadith-narrator {
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        .hadith-grade {
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-right: auto;
        }

        .hadith-grade.صحيح {
            background: rgba(45, 106, 79, 0.15);
            border: 1px solid rgba(45, 106, 79, 0.2);
            color: var(--green-light);
        }

        .hadith-grade.hسن {
            background: rgba(212, 168, 67, 0.1);
            border: 1px solid rgba(212, 168, 67, 0.2);
            color: var(--gold);
        }

        .hadith-grade.ضعيف {
            background: rgba(180, 60, 60, 0.1);
            border: 1px solid rgba(180, 60, 60, 0.2);
            color: #e57373;
        }

        .hadith-tags {
            display: flex;
            gap: 6px;
            margin-top: 12px;
        }

        .hadith-tag {
            background: rgba(45, 106, 79, 0.15);
            border: 1px solid rgba(45, 106, 79, 0.2);
            color: var(--green-light);
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
        }

        .empty-state {
            text-align: center;
            padding: 64px 0;
            color: var(--text-secondary);
        }

        .loading {
            text-align: center;
            padding: 64px 0;
            color: var(--gold-dim);
            font-size: 1.1rem;
        }

        .spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--gold-dim);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 640px) {
            header h1 {
                font-size: 1.5rem;
            }

            .hadith-card {
                padding: 20px;
            }

            .hadith-text {
                font-size: 1.15rem;
            }

            .filters {
                gap: 8px;
            }

            .filter-btn {
                padding: 6px 14px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <a href="index.html" class="back-link">→</a>
            <h1>أحاديث نبوية</h1>
        </header>

        <div class="filters" id="filters"></div>

        <div id="hadith-container">
            <div class="loading">
                <div class="spinner"></div>
                <div>جارٍ التحميل...</div>
            </div>
        </div>
    </div>

    <script>
        const DATA_URLS = [
            'https://raw.githubusercontent.com/Gameman2012/athkar/main/data/ahadith.json',
            '../data/ahadith.json'
        ];

        let allAhadith = [];
        let activeTag = 'الكل';

        async function loadAhadith() {
            let data = null;
            for (const url of DATA_URLS) {
                try {
                    const res = await fetch(url);
                    if (!res.ok) continue;
                    data = await res.json();
                    break;
                } catch {}
            }

            if (!data) {
                document.getElementById('hadith-container').innerHTML =
                    '<div class="empty-state">حدث خطأ أثناء تحميل البيانات</div>';
                return;
            }

            allAhadith = data.ahadith;
            renderFilters(data.tags);
            renderAhadith(allAhadith);
        }

        function renderFilters(tags) {
            const container = document.getElementById('filters');
            const allBtn = document.createElement('button');
            allBtn.className = 'filter-btn active';
            allBtn.textContent = 'الكل';
            allBtn.onclick = () => filterByTag('الكل');
            container.appendChild(allBtn);

            tags.forEach(tag => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.textContent = tag;
                btn.onclick = () => filterByTag(tag);
                container.appendChild(btn);
            });
        }

        function filterByTag(tag) {
            activeTag = tag;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent === tag);
            });

            if (tag === 'الكل') {
                renderAhadith(allAhadith);
            } else {
                const filtered = allAhadith.filter(h => h.tags.includes(tag));
                renderAhadith(filtered);
            }
        }

        function renderAhadith(ahadith) {
            const container = document.getElementById('hadith-container');

            if (ahadith.length === 0) {
                container.innerHTML = '<div class="empty-state">لا أحاديث في هذا التصنيف</div>';
                return;
            }

            container.innerHTML = '<div class="hadith-list">' + ahadith.map(h => `
                <div class="hadith-card">
                    <div class="hadith-text">${h.text}</div>
                    <div class="hadith-meta">
                        <span class="hadith-source">${h.source}</span>
                        <span class="hadith-narrator">${h.narrator}</span>
                        <span class="hadith-grade ${h.grade}">${h.grade}</span>
                    </div>
                    <div class="hadith-tags">
                        ${h.tags.map(t => `<span class="hadith-tag">${t}</span>`).join('')}
                    </div>
                </div>
            `).join('') + '</div>';
        }

        loadAhadith();
    </script>

</body>
</html>
