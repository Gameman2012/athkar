<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أحاديث نبوية — نور</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../design sys/style.css">
</head>
<body>

    <div class="container">
        <header>
            <a href="index.html" class="back-link">→</a>
            <h1>أحاديث نبوية</h1>
        </header>

        <div class="filters" id="filters"></div>

        <div id="hadith-container">
            <div class="loading">
                <div class="spinner"></div>
                <div>جارٍ التحميل...</div>
            </div>
        </div>
    </div>

    <script>
        const DATA_URL = 'https://raw.githubusercontent.com/Gameman2012/athkar/main/data/ahadith.json';
        const CACHE_KEY = 'ahadith_cache';
        const CACHE_TTL = 24 * 60 * 60 * 1000;

        let allAhadith = [];
        let activeTag = 'الكل';

        function getCached() {
            try {
                const c = JSON.parse(localStorage.getItem(CACHE_KEY));
                if (c && Date.now() - c.ts < CACHE_TTL) return c.data;
            } catch {}
            return null;
        }

        function setCache(data) {
            try { localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), data })); } catch {}
        }

        async function loadAhadith() {
            const cached = getCached();
            if (cached) {
                allAhadith = cached.ahadith;
                renderFilters(cached.tags);
                renderAhadith(allAhadith);
                return;
            }
            try {
                const res = await fetch(DATA_URL);
                const data = await res.json();
                setCache(data);
                allAhadith = data.ahadith;
                renderFilters(data.tags);
                renderAhadith(allAhadith);
            } catch (err) {
                document.getElementById('hadith-container').innerHTML =
                    '<div class="empty-state">حدث خطأ أثناء تحميل البيانات</div>';
            }
        }

        function renderFilters(tags) {
            const container = document.getElementById('filters');
            const allBtn = document.createElement('button');
            allBtn.className = 'filter-btn active';
            allBtn.textContent = 'الكل';
            allBtn.onclick = () => filterByTag('الكل');
            container.appendChild(allBtn);

            tags.forEach(tag => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.textContent = tag;
                btn.onclick = () => filterByTag(tag);
                container.appendChild(btn);
            });
        }

        function filterByTag(tag) {
            activeTag = tag;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent === tag);
            });

            if (tag === 'الكل') {
                renderAhadith(allAhadith);
            } else {
                const filtered = allAhadith.filter(h => h.tags.includes(tag));
                renderAhadith(filtered);
            }
        }

        function renderAhadith(ahadith) {
            const container = document.getElementById('hadith-container');

            if (ahadith.length === 0) {
                container.innerHTML = '<div class="empty-state">لا أحاديث في هذا التصنيف</div>';
                return;
            }

            container.innerHTML = '<div class="hadith-list">' + ahadith.map(h => `
                <div class="hadith-card">
                    <div class="hadith-text">${h.text}</div>
                    <div class="hadith-meta">
                        <span class="hadith-source">${h.source}</span>
                        <span class="hadith-narrator">${h.narrator}</span>
                        <span class="hadith-grade ${h.grade}">${h.grade}</span>
                    </div>
                    <div class="hadith-tags">
                        ${h.tags.map(t => `<span class="hadith-tag">${t}</span>`).join('')}
                    </div>
                </div>
            `).join('') + '</div>';
        }

        loadAhadith();
    </script>

</body>
</html>
