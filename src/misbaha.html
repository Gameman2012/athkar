<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>مسبحة رقمية — نور</title>
    <meta name="description" content="مسبحة رقمية — عدّاد ذكر مع صوت نقر وحفظ تلقائي">
    <meta property="og:title" content="مسبحة رقمية — نور">
    <meta property="og:description" content="مسبحة رقمية — عدّاد ذكر مع صوت نقر وحفظ تلقائي">
    <meta property="og:type" content="website">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0e1a;
            --bg-card: #111827;
            --gold: #d4a843;
            --gold-light: #f0d48a;
            --gold-dim: #8a6d2b;
            --text-primary: #e8e0d0;
            --text-secondary: #9a917e;
            --border: #1e293b;
        }

        body {
            font-family: 'Noto Naskh Arabic', serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 20% 0%, rgba(212, 168, 67, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 100%, rgba(45, 106, 79, 0.06) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 24px;
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 48px 0 16px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-link {
            color: var(--gold-dim);
            text-decoration: none;
            font-size: 1.5rem;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: var(--gold);
        }

        header h1 {
            font-family: 'Amiri', serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--gold);
        }

        .dhikr-select-wrap {
            text-align: center;
            margin-bottom: 24px;
        }

        .dhikr-select {
            font-family: 'Amiri', serif;
            font-size: 1.2rem;
            background: var(--bg-card);
            color: var(--gold);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 20px;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            text-align: center;
            min-width: 220px;
        }

        .dhikr-select:focus {
            outline: none;
            border-color: var(--gold-dim);
        }

        .counter-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 16px 0;
            -webkit-tap-highlight-color: transparent;
        }

        .circle {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            border: 3px solid var(--gold-dim);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .circle.pulse {
            animation: pulseRing 0.35s ease-out;
        }

        @keyframes pulseRing {
            0% { box-shadow: 0 0 0 0 rgba(212, 168, 67, 0.4); }
            100% { box-shadow: 0 0 0 30px rgba(212, 168, 67, 0); }
        }

        .counter-num {
            font-family: 'Amiri', serif;
            font-size: 4.5rem;
            font-weight: 700;
            color: var(--gold);
            text-shadow: 0 0 40px rgba(212, 168, 67, 0.25);
            transition: transform 0.1s;
            pointer-events: none;
        }

        .counter-num.bump {
            animation: bump 0.12s ease-out;
        }

        @keyframes bump {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .dhikr-label {
            font-family: 'Amiri', serif;
            font-size: 1.4rem;
            color: var(--text-secondary);
            margin-top: 24px;
            pointer-events: none;
        }

        .controls {
            padding-bottom: 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .reset-btn {
            font-family: 'Amiri', serif;
            font-size: 1rem;
            background: transparent;
            color: var(--gold-dim);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 28px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .reset-btn:hover {
            border-color: var(--gold-dim);
            color: var(--gold);
        }

        .reset-btn:active {
            transform: scale(0.96);
        }

        @media (max-width: 640px) {
            header {
                padding: 36px 0 12px;
            }

            header h1 {
                font-size: 1.5rem;
            }

            .circle {
                width: 200px;
                height: 200px;
            }

            .counter-num {
                font-size: 3.5rem;
            }

            .dhikr-label {
                font-size: 1.2rem;
            }
        }

        @media (min-height: 800px) {
            .circle {
                width: 280px;
                height: 280px;
            }

            .counter-num {
                font-size: 5.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <a href="index.html" class="back-link">→</a>
            <h1>مسبحة رقمية</h1>
        </header>

        <div class="dhikr-select-wrap">
            <select class="dhikr-select" id="dhikrSelect">
                <option value="سُبْحَانَ اللَّه">سُبْحَانَ اللَّه</option>
                <option value="الْحَمْدُ لِلَّه">الْحَمْدُ لِلَّه</option>
                <option value="اللَّهُ أَكْبَر">اللَّهُ أَكْبَر</option>
                <option value="لَا إِلَهَ إِلَّا اللَّه">لَا إِلَهَ إِلَّا اللَّه</option>
                <option value="أَسْتَغْفِرُ اللَّه">أَسْتَغْفِرُ اللَّه</option>
                <option value="لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّه">لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّه</option>
                <option value="سُبْحَانَ اللَّه وَبِحَمْدِهِ">سُبْحَانَ اللَّه وَبِحَمْدِهِ</option>
                <option value="سُبْحَانَ اللَّه الْعَظِيم">سُبْحَانَ اللَّه الْعَظِيم</option>
            </select>
        </div>

        <div class="counter-area" id="counterArea">
            <div class="circle" id="circle">
                <span class="counter-num" id="counterNum">0</span>
            </div>
            <div class="dhikr-label" id="dhikrLabel">سُبْحَانَ اللَّه</div>
        </div>

        <div class="controls">
            <button class="reset-btn" id="resetBtn">إعادة ضبط</button>
        </div>
    </div>

    <script>
        const STORAGE_KEY_COUNT = 'misbaha_count';
        const STORAGE_KEY_DHIKR = 'misbaha_dhikr';

        const counterNum = document.getElementById('counterNum');
        const circle = document.getElementById('circle');
        const counterArea = document.getElementById('counterArea');
        const dhikrSelect = document.getElementById('dhikrSelect');
        const dhikrLabel = document.getElementById('dhikrLabel');
        const resetBtn = document.getElementById('resetBtn');

        let count = parseInt(localStorage.getItem(STORAGE_KEY_COUNT)) || 0;
        let audioCtx = null;

        function render() {
            counterNum.textContent = count;
        }

        function getAudioCtx() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioCtx;
        }

        function playClick() {
            try {
                const ctx = getAudioCtx();
                if (ctx.state === 'suspended') ctx.resume();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = 800;
                osc.type = 'sine';
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.06);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.06);
            } catch {}
        }

        function vibrate() {
            if (navigator.vibrate) navigator.vibrate(10);
        }

        function increment() {
            count++;
            render();
            localStorage.setItem(STORAGE_KEY_COUNT, count);
            playClick();
            vibrate();

            counterNum.classList.remove('bump');
            circle.classList.remove('pulse');
            void counterNum.offsetWidth;
            void circle.offsetWidth;
            counterNum.classList.add('bump');
            circle.classList.add('pulse');
        }

        function reset() {
            count = 0;
            render();
            localStorage.setItem(STORAGE_KEY_COUNT, count);
        }

        counterArea.addEventListener('click', (e) => {
            e.preventDefault();
            increment();
        });

        resetBtn.addEventListener('click', () => {
            if (count === 0) return;
            reset();
        });

        resetBtn.addEventListener('dblclick', () => {
            reset();
        });

        dhikrSelect.addEventListener('change', () => {
            const val = dhikrSelect.value;
            dhikrLabel.textContent = val;
            localStorage.setItem(STORAGE_KEY_DHIKR, val);
        });

        // Restore saved state
        const savedDhikr = localStorage.getItem(STORAGE_KEY_DHIKR);
        if (savedDhikr) {
            dhikrSelect.value = savedDhikr;
            dhikrLabel.textContent = savedDhikr;
        }

        render();
    </script>

</body>
</html>
