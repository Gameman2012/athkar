<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>مسبحة رقمية — نور</title>
    <meta name="description" content="مسبحة رقمية — عدّاد ذكر مع صوت نقر وحفظ تلقائي">
    <meta property="og:title" content="مسبحة رقمية — نور">
    <meta property="og:description" content="مسبحة رقمية — عدّاد ذكر مع صوت نقر وحفظ تلقائي">
    <meta property="og:type" content="website">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../design sys/style.css">
</head>
<body>

    <div class="container">
        <header>
            <a href="index.html" class="back-link">→</a>
            <h1>مسبحة رقمية</h1>
        </header>

        <div class="dhikr-select-wrap">
            <select class="dhikr-select" id="dhikrSelect">
                <option value="سُبْحَانَ اللَّه">سُبْحَانَ اللَّه</option>
                <option value="الْحَمْدُ لِلَّه">الْحَمْدُ لِلَّه</option>
                <option value="اللَّهُ أَكْبَر">اللَّهُ أَكْبَر</option>
                <option value="لَا إِلَهَ إِلَّا اللَّه">لَا إِلَهَ إِلَّا اللَّه</option>
                <option value="أَسْتَغْفِرُ اللَّه">أَسْتَغْفِرُ اللَّه</option>
                <option value="لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّه">لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّه</option>
                <option value="سُبْحَانَ اللَّه وَبِحَمْدِهِ">سُبْحَانَ اللَّه وَبِحَمْدِهِ</option>
                <option value="سُبْحَانَ اللَّه الْعَظِيم">سُبْحَانَ اللَّه الْعَظِيم</option>
            </select>
        </div>

        <div class="counter-area" id="counterArea">
            <div class="circle" id="circle">
                <span class="counter-num" id="counterNum">0</span>
            </div>
            <div class="dhikr-label" id="dhikrLabel">سُبْحَانَ اللَّه</div>
        </div>

        <div class="controls">
            <button class="reset-btn" id="resetBtn">إعادة ضبط</button>
        </div>
    </div>

    <script>
        const STORAGE_KEY_COUNT = 'misbaha_count';
        const STORAGE_KEY_DHIKR = 'misbaha_dhikr';

        const counterNum = document.getElementById('counterNum');
        const circle = document.getElementById('circle');
        const counterArea = document.getElementById('counterArea');
        const dhikrSelect = document.getElementById('dhikrSelect');
        const dhikrLabel = document.getElementById('dhikrLabel');
        const resetBtn = document.getElementById('resetBtn');

        let count = parseInt(localStorage.getItem(STORAGE_KEY_COUNT)) || 0;
        let audioCtx = null;

        function render() {
            counterNum.textContent = count;
        }

        function getAudioCtx() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioCtx;
        }

        function playClick() {
            try {
                const ctx = getAudioCtx();
                if (ctx.state === 'suspended') ctx.resume();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = 800;
                osc.type = 'sine';
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.06);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.06);
            } catch {}
        }

        function vibrate() {
            if (navigator.vibrate) navigator.vibrate(10);
        }

        function increment() {
            count++;
            render();
            localStorage.setItem(STORAGE_KEY_COUNT, count);
            playClick();
            vibrate();

            counterNum.classList.remove('bump');
            circle.classList.remove('pulse');
            void counterNum.offsetWidth;
            void circle.offsetWidth;
            counterNum.classList.add('bump');
            circle.classList.add('pulse');
        }

        function reset() {
            count = 0;
            render();
            localStorage.setItem(STORAGE_KEY_COUNT, count);
        }

        counterArea.addEventListener('click', (e) => {
            e.preventDefault();
            increment();
        });

        resetBtn.addEventListener('click', () => {
            if (count === 0) return;
            reset();
        });

        resetBtn.addEventListener('dblclick', () => {
            reset();
        });

        dhikrSelect.addEventListener('change', () => {
            const val = dhikrSelect.value;
            dhikrLabel.textContent = val;
            localStorage.setItem(STORAGE_KEY_DHIKR, val);
        });

        // Restore saved state
        const savedDhikr = localStorage.getItem(STORAGE_KEY_DHIKR);
        if (savedDhikr) {
            dhikrSelect.value = savedDhikr;
            dhikrLabel.textContent = savedDhikr;
        }

        render();
    </script>

</body>
</html>
